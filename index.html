<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Regalo de Cupido 💛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" id="tarjetaPrincipal">
        <!-- VISTA 1: MODO CREADOR -->
        <div id="vistaCreador">
            <h1>🏹 Creador de Dedicatorias 🏹</h1>
            <div class="input-group">
                <label>Tu Nombre (Att):</label>
                <input type="text" id="creador" placeholder="Tu nombre">
            </div>
            <div class="input-group">
                <label>¿Para quién es?:</label>
                <input type="text" id="para" placeholder="Su nombre">
            </div>
            <div class="input-group">
                <label>Fecha de su Aniversario / Especial:</label>
                <input type="date" id="fechaEspecial">
            </div>
            <button id="btnGenerar" onclick="generarEnlace()">✨ Generar Enlace Secreto ✨</button>
            <div id="contenedorEnlace" class="link-box" style="display: none;">
                <p>¡Listo! Copia este link y envíaselo:</p>
                <input type="text" id="inputEnlace" readonly onclick="this.select()">
                <button onclick="copiarLink()" class="btn-copy">📋 Copiar Link</button>
            </div>
        </div>

        <!-- VISTA 2: MODO PAREJA (VALIDACIÓN) -->
        <div id="vistaPareja" style="display: none;">
            <h1 id="tituloPareja">💝 Tienes un regalo de amor...</h1>
            <p class="instruccion">Para desbloquear tu dedicatoria, introduce la fecha de su día especial:</p>
            <div class="input-group">
                <input type="date" id="fechaValidar">
            </div>
            <button id="btnValidar" onclick="validarFechaYMostrar()">🔓 Abrir Regalo 🌻</button>
        </div>

        <!-- PANTALLA COMPARTIDA: Carta con efecto máquina de escribir -->
        <div id="pantallaTexto" class="text-box" style="display: none;"></div>
        
        <!-- BOTÓN CONTINUAR: Aparece solo al finalizar el texto -->
        <button id="btnContinuar" onclick="mostrarSorpresaFinal()" style="display: none; margin-top: 15px;">Siguiente ➡️</button>
    </div>

    <!-- PANTALLA FINAL: El Corazón Gigante y la Flecha de Cupido -->
    <div id="pantallaFinal" class="pantalla-final" style="display: none;">
        <div class="escena-cupido">
            <div class="flecha-cupido">💘</div>
            <div class="corazon-gigante"></div>
        </div>
        <h2 class="texto-final">¡Te Amo! 💝</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
